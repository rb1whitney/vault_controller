api_paths:
- api_path: v1/sys/mounts/app1-team-secrets
  api_payload:
    description: app1 team secrets
    listing_visibility: hidden
    type: kv
  api_action: post
- api_path: v1/sys/mounts/app1-authenticator
  api_payload:
    description: authenticator kv secrets
    listing_visibility: hidden
    type: kv
  api_action: post
- api_path: v1/transit/keys/app1-transit-key
  api_payload:
    allow_plaintext_backup: false
    convergent_encryption: false
    exportable: false
    type: aes256-gcm96
  api_action: post
- api_path: v1/transit/keys/app1-transit-key/config
  api_payload:
    allow_plaintext_backup: false
    min_encryption_version: 1
    min_decryption_version: 1
    exportable: false
  api_action: post
