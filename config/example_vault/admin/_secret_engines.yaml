# Mounts and configures Secret Engines (e.g., KV, Transit, PKI).

api_paths:
- api_path: v1/sys/mounts/vault-admin
  api_payload:
    description: Vault Admin KV-Secrets
    listing_visibility: hidden
    type: kv
  api_action: post
- api_path: v1/sys/mounts/vault-auditor
  api_payload:
    description: Vault Auditors KV Secrets
    listing_visibility: hidden
    type: kv
  api_action: post
- api_path: v1/sys/mounts/vault-blah
  api_payload:
    description: Vault Auditors KV Secrets
    listing_visibility: hidden
    type: kv
  api_action: post
- api_path: v1/sys/mounts/transit
  api_payload:
    description: Vault Cluster Default Transit Engine
    listing_visibility: hidden
    type: transit
  api_action: post
- api_path: v1/transit/keys/vault-admin-transit-key
  api_payload:
    allow_plaintext_backup: false
    convergent_encryption: false
    exportable: false
    type: aes256-gcm96
  api_action: post
- api_path: v1/transit/keys/vault-admin-transit-key/config
  api_payload:
    allow_plaintext_backup: false
    min_encryption_version: 1
    min_decryption_version: 1
    exportable: false
  api_action: post
- api_path: v1/transit/keys/vault-auditor-transit-key
  api_payload:
    allow_plaintext_backup: false
    convergent_encryption: false
    exportable: false
    type: aes256-gcm96
  api_action: post
- api_path: v1/transit/keys/vault-auditor-transit-key/config
  api_payload:
    allow_plaintext_backup: false
    min_encryption_version: 1
    min_decryption_version: 1
    exportable: false
  api_action: post
