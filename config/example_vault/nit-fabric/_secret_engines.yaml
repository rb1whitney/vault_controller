# Configures Secret Engines for NIT-Fabric.
# Enables both KV for credentials and Transit for policy data protection.
api_paths:
- api_path: v1/sys/mounts/nit-fabric
  api_action: post
  api_payload:
    description: "NIT-Fabric Governance Engine Secrets"
    type: kv
    options:
      version: "2"
- api_path: v1/sys/mounts/nit-fabric-transit
  api_action: post
  api_payload:
    description: "NIT-Fabric Policy Encryption"
    type: transit
