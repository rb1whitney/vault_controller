[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-controller"
version = "0.1.0"
authors = [
  { name="Richard Whitney" },
]
description = "A comprehensive Vault controller for managing secrets, auth methods, and cluster lifecycle."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "PyYAML",
    "urllib3",
    "hvac",
    "pydantic",
    "typer",
    "rich",
]

[project.scripts]
vault-ctl = "projects.vault_controller.bin.vault_ctl:app"

[project.urls]
"Homepage" = "https://github.com/rb1whitney/vault-controller"
"Bug Tracker" = "https://github.com/rb1whitney/vault-controller/issues"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
pythonpath = ["../.."]
testpaths = [
    "tests",
]
